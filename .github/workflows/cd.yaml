name: CD pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "terraform/**"
      - "observability/**"
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ci.yaml

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test  

    permissions:
      packages: write

    steps:
      - name: Log in to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:app"
          push: true
          tags: |
            ghcr.io/brunolperronegatti/devops-challenge:latest
            ghcr.io/brunolperronegatti/devops-challenge:${{ github.sha }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    
    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::816344831324:role/GitHubActions-EKS-Deploy
          aws-region: us-east-2
        
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-2 --name devops-challenge

      - name: Deploy application
        run: |
          kubectl set image deployment/devops-challenge-app \
            devops-challenge-app=ghcr.io/brunolperronegatti/devops-challenge:${{ github.sha }} \
            -n development

      - name: Wait for rollout
        run: kubectl rollout status deployment/devops-challenge-app -n development