name: CD pipeline

on:
  push:
    branches: ["main"]
  paths-ignore:
    - "README.md"
    - "docs/**"
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ci.yaml

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test  

    permissions:
      packages: write

    steps:
      - name: Log in to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/brunolperronegatti/devops-challenge:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/devops-challenge-key.pem
          chmod 600 ~/.ssh/devops-challenge-key.pem

      - name: Install Ansible
        run: pip install ansible

      - name: Deploy with Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yaml