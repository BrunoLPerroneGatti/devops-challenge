---
- name: Deploy DevOps challenge with Docker
  hosts: webservers
  become: true

  vars:
    app_user: ubuntu
    app_dir: /home/ubuntu/devops-challenge
    app_message: "hello world from EC2 with docker"
    image: ghcr.io/brunolperronegatti/devops-challenge:latest

  tasks:
    - name: Update and upgrade apt cache
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Add Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
        daemon_reload: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"

    - name: Copy nginx.conf
      ansible.builtin.copy:
        src: files/nginx.conf
        dest: "{{ app_dir }}/nginx.conf"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"

    - name: Copy docker-compose.yaml
      ansible.builtin.template:
        src: templates/docker-compose.yaml.j2
        dest: "{{ app_dir }}/docker-compose.yaml"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"

    - name: Start application
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present