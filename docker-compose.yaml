services:

  app:
    build: ./app
    expose:
      - "8080"
    environment:
      - APP_MESSAGE="hello universe from docker-compose"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.31.4-alpine3.24
    ports:
      - "80:80"
    volumes:
      - ./ansible/files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.0
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yaml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - app
      - alertmanager
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
  
  alloy:
    image: grafana/alloy:v1.19.0
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped