apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-challenge-app
  namespace: development

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-challenge-app

  template:
    metadata:
      labels:
        app: devops-challenge-app

    spec:
      containers:
        - name: devops-challenge-app
          image: ghcr.io/brunolperronegatti/devops-challenge:latest
          ports:
            - name: http
              containerPort: 8080
