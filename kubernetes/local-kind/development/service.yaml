apiVersion: v1
kind: Service
metadata:
  name: devops-challenge-app
  namespace: development
  labels:
    app: devops-challenge-app
spec:
  type: NodePort
  selector:
    app: devops-challenge-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30000